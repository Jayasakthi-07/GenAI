packages:
  - apps/*
  - packages/*

# pnpm blocks dependency build scripts unless they are reviewed here.
allowBuilds:
  # Verifies its platform-specific binary.
  esbuild: true
  # Prisma's CLI and the schema engine used by `prisma migrate`.
  '@prisma/engines': true
  prisma: true
  # Its preinstall is a no-op echo.
  '@google/genai': false
  # Its postinstall only checks dependent versions.
  protobufjs: false

# Released less than pnpm's minimum release age at install time.
minimumReleaseAgeExclude:
  - '@fastify/static@10.1.5'
